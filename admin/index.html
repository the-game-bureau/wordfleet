<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Book Publishing | The Game Bureau</title>
  <link rel="icon" href="icon.ico">
  <style>
    :root {
      color-scheme: light;
      font: 100%/1.5 system-ui, sans-serif;
      color: #192f27;
      background: #f7f5ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      border-top: .3rem solid #192f27;
    }

    header {
      border-bottom: 1px solid #d6d8ca;
      padding: 1rem max(1rem, calc((100% - 45rem) / 2));
    }

    header { font-weight: 750; }

    main {
      width: min(100% - 2rem, 45rem);
      margin: clamp(2rem, 8vw, 5rem) auto;
      padding: clamp(1.25rem, 6vw, 3rem);
      border: 1px solid #d6d8ca;
      border-radius: .35rem;
      background: #fffdf6;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.15rem);
      line-height: 1.08;
      letter-spacing: -.04em;
    }

    p {
      max-width: 48ch;
      margin: 1rem 0 1.5rem;
      color: #4b594e;
    }

    button {
      min-height: 3rem;
      padding: .65rem 1.15rem;
      border: 1px solid #192f27;
      border-radius: .25rem;
      background: #192f27;
      color: #fffdf6;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #446351; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid #a1402e; outline-offset: 4px; }
    #status { min-height: 1.5em; margin: .8rem 0 0; }

    .book-title {
      margin: .75rem 0 .4rem;
      color: #192f27;
      font-weight: 700;
    }

    .preview-links, .download-links {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem 1.25rem;
      padding: 0;
      list-style: none;
    }

    .preview-links { margin: 0 0 1.35rem; }
    .download-links { margin: .85rem 0 0; }
    a { color: #274e3c; text-underline-offset: .18em; }
    [hidden] { display: none; }
  </style>
  <script type="module" src="admin.js"></script>
</head>
<body>
  <header>The Game Bureau</header>
  <main>
    <h1>Book publishing</h1>
    <div id="publishing" hidden>
      <p class="book-title" id="book-title"></p>
      <p id="book-details"></p>
      <ul class="preview-links">
        <li><a href="preview/book" target="_blank" rel="noopener">Preview the full book</a></li>
        <li><a href="preview/sampler" target="_blank" rel="noopener">Preview the sampler</a></li>
      </ul>
      <button id="generate" type="button">Generate Book</button>
      <ul class="download-links" id="downloads" hidden>
        <li><a href="files/book.pdf" download>Download the full book</a></li>
        <li><a href="files/sampler.pdf" download>Download the sampler</a></li>
      </ul>
    </div>
    <p id="status" role="status">Connecting to the local publishing server.</p>
    <noscript><p>Use <code>npm run book:build</code> to export from the terminal.</p></noscript>
  </main>
</body>
</html>
